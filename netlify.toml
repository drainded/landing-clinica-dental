# Archivos de desarrollo que no deben publicarse: se responden con 404 forzado.
# Si el despliegue es en Cloudflare Pages, el equivalente es un archivo `_redirects`
# en la raíz con estas mismas rutas (una por línea, con estado 404), por ejemplo:
#   /referencias/*  /404.html  404
#   /specs/*        /404.html  404
#   /.specify/*     /404.html  404
#   /.claude/*      /404.html  404
#   /SPEC.md        /404.html  404

[[redirects]]
  from = "/referencias/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/specs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.specify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SPEC.md"
  to = "/404.html"
  status = 404
  force = true

# Caché de activos: el HTML se revalida siempre; el resto se guarda un día (los archivos no llevan hash
# en el nombre, así que no se usa `immutable`). Netlify ya comprime el texto con Brotli/gzip.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
